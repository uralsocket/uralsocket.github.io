<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gleb | Portfolio Update</title>
    <style>
        :root {
            --bg-color: #0c0c0e;
            --text-main: #f5f5f5;
            --text-muted: #8a8a93;
            --border-color: #2a2a2e;
            --accent-color: #ffffff;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            animation: fadeUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 500;
            margin: 0 0 12px 0;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 1rem;
            color: var(--text-muted);
            margin: 0 0 40px 0;
            line-height: 1.5;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        a {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.3s ease;
            letter-spacing: 0.02em;
            background-color: transparent;
        }
        a:hover {
            border-color: var(--accent-color);
            background-color: rgba(255, 255, 255, 0.03);
            transform: translateY(-2px);
        }
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Portfolio Update</h1>
        <p>I'm currently rebuilding my website. Meanwhile, let's stay in touch.</p>
        <div class="links">
            <a href="https://t.me/uralsocket" target="_blank" rel="noopener noreferrer">Text me in Telegram</a>
            <a href="mailto:uralsocket@gmail.com">Text me on Email</a>
            <a href="https://linkedin.com/in/uralsocket/" target="_blank" rel="noopener noreferrer">Check my LinkedIn</a>
        </div>
    </div>
</body>
</html>
