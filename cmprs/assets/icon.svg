<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="title">
  <title id="title">CMPRS — четыре стрелки сжатия вокруг кнопки воспроизведения</title>
  <defs>
    <linearGradient id="tile" x1="70" y1="18" x2="180" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b1d1e"/>
      <stop offset=".46" stop-color="#101112"/>
      <stop offset="1" stop-color="#08090a"/>
    </linearGradient>
    <linearGradient id="edge" x1="72" y1="18" x2="186" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e6e8e9" stop-opacity=".5"/>
      <stop offset=".4" stop-color="#777b7e" stop-opacity=".28"/>
      <stop offset="1" stop-color="#777b7e" stop-opacity=".12"/>
    </linearGradient>
    <radialGradient id="surface" cx="0" cy="0" r="1" gradientTransform="translate(102 22) rotate(80) scale(96 166)" gradientUnits="userSpaceOnUse">
